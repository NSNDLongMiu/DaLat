<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quay món ăn</title>
  <style>
    :root {
      --ink: #202b2d;
      --muted: #6d7c7c;
      --paper: #f7f5ef;
      --card: #fffdf8;
      --line: #d8dfd8;
      --accent: #d96545;
      --accent-dark: #9d3f2d;
      --teal: #287b78;
      --gold: #c9972b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; margin: 0; color: var(--ink);
      background: linear-gradient(135deg, #f8f5ed 0%, #eef4ee 100%);
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .page {
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; min-height: 100dvh; padding: 16px 14px 28px; gap: 14px;
    }
    .topbar { width: 100%; max-width: 720px; display: flex; align-items: center; gap: 10px; }
    .back-link {
      text-decoration: none; color: var(--accent-dark); font-weight: 700; font-size: 13px;
      padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .back-link:hover { background: var(--accent-dark); color: #fff; }
    h1 { margin: 0 0 4px; color: #173f40; font-size: clamp(22px, 5vw, 30px); font-weight: 800; text-align: center; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; text-align: center; max-width: 480px; }

    .reel-viewport {
      position: relative; width: 100%; max-width: 720px; height: 190px;
      overflow: hidden; border-radius: 16px; background: #fffdf8;
      border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(23,39,37,.1);
    }
    .reel-viewport::before {
      content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px;
      transform: translateX(-50%); background: var(--accent-dark); z-index: 5; opacity: .85;
    }
    .reel-viewport::after {
      content: ""; position: absolute; left: 50%; top: 0; width: 0; height: 0; transform: translateX(-50%);
      border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 12px solid var(--accent-dark);
      z-index: 6;
    }
    .reel-fade-l, .reel-fade-r {
      position: absolute; top: 0; bottom: 0; width: 60px; z-index: 4; pointer-events: none;
    }
    .reel-fade-l { left: 0; background: linear-gradient(90deg, #fffdf8, transparent); }
    .reel-fade-r { right: 0; background: linear-gradient(-90deg, #fffdf8, transparent); }
    .reel-track { position: absolute; top: 0; left: 0; height: 100%; display: flex; align-items: center; will-change: transform; }
    .food-card {
      flex: 0 0 auto; width: 130px; height: 160px; margin: 0 8px; border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      color: #fff; text-align: center; padding: 10px; position: relative; overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,.15);
    }
    .food-card .fc-emoji { font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
    .food-card .fc-name { font-size: 12.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .food-card.rare { box-shadow: 0 0 0 3px var(--gold), 0 4px 14px rgba(201,151,43,.5); }
    .food-card.rare::before {
      content: "★ HIẾM"; position: absolute; top: 6px; left: 0; right: 0; text-align: center;
      font-size: 9px; font-weight: 800; letter-spacing: .05em; color: #3a2a05;
      background: var(--gold); padding: 2px 0;
    }

    .spin-btn {
      width: 100%; max-width: 320px; padding: 15px 20px; border-radius: 12px; border: 1px solid var(--accent-dark);
      color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      font: 800 16px Arial, sans-serif; letter-spacing: .04em; cursor: pointer; text-transform: uppercase;
    }
    .spin-btn:hover:not(:disabled) { background: var(--accent-dark); }
    .spin-btn:disabled { opacity: .6; cursor: default; }

    .result-panel {
      width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 18px; text-align: center; opacity: 0; transform: translateY(6px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .result-panel.show { opacity: 1; transform: translateY(0); }
    .result-panel .rp-emoji { font-size: 46px; }
    .result-panel .rp-name { margin: 6px 0 2px; font-size: 20px; font-weight: 800; color: #173f40; }
    .result-panel .rp-category { color: var(--muted); font-size: 12.5px; }
    .result-panel .rp-rare { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 99px; background: var(--gold); color: #3a2a05; font-size: 11px; font-weight: 800; letter-spacing: .04em; }

    .history-wrap { width: 100%; max-width: 480px; }
    .history-title { color: var(--muted); font: 700 11px Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
    .history-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .history-chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 99px;
      background: #fff; border: 1px solid var(--line); font-size: 12px; color: var(--ink);
    }

    .load-error { color: var(--accent-dark); font-weight: 700; text-align: center; max-width: 480px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back-link" href="an-uong.html">← Nhật ký ăn uống</a>
    </div>
    <h1>🎰 Quay món ăn hôm nay</h1>
    <p class="subtitle">Không biết ăn gì? Quay 1 phát cho đỡ đau đầu — hơn 200 món, thi thoảng trúng món "hiếm" cho đổi vị.</p>

    <div class="reel-viewport" id="reel-viewport">
      <div class="reel-fade-l"></div>
      <div class="reel-fade-r"></div>
      <div class="reel-track" id="reel-track"></div>
    </div>

    <button type="button" class="spin-btn" id="spin-btn" disabled>Đang tải dữ liệu…</button>

    <div class="result-panel" id="result-panel">
      <div class="rp-emoji" id="rp-emoji"></div>
      <div class="rp-name" id="rp-name"></div>
      <div class="rp-category" id="rp-category"></div>
      <div id="rp-rare-badge"></div>
    </div>

    <div class="history-wrap" id="history-wrap" style="display:none">
      <p class="history-title">Đã quay gần đây</p>
      <div class="history-list" id="history-list"></div>
    </div>

    <p class="load-error" id="load-error" style="display:none"></p>
  </div>

  <script>
    const DATA_URL = 'food-gacha-data.json';
    const CARD_WIDTH = 146; // 130px card + 2x8px margin
    const REEL_SLOTS = 60;
    const WINNER_INDEX = 48;
    const HISTORY_KEY = 'gacha-mon-an-history';

    const reelTrack = document.querySelector('#reel-track');
    const reelViewport = document.querySelector('#reel-viewport');
    const spinBtn = document.querySelector('#spin-btn');
    const resultPanel = document.querySelector('#result-panel');
    const loadError = document.querySelector('#load-error');
    const historyWrap = document.querySelector('#history-wrap');
    const historyList = document.querySelector('#history-list');

    let foods = [];
    let spinning = false;

    function hashHue(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return h % 360;
    }

    function cardStyle(food) {
      const hue = hashHue(food.name);
      return `background: linear-gradient(150deg, hsl(${hue},62%,48%), hsl(${(hue + 40) % 360},58%,36%));`;
    }

    function cardHtml(food) {
      return `<div class="food-card${food.rare ? ' rare' : ''}" style="${cardStyle(food)}">
        <span class="fc-emoji">${food.emoji || '🍽️'}</span>
        <span class="fc-name">${escapeHtml(food.name)}</span>
      </div>`;
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function randomFood() {
      return foods[Math.floor(Math.random() * foods.length)];
    }

    function renderHistory() {
      let hist = [];
      try { hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (err) { hist = []; }
      if (!hist.length) { historyWrap.style.display = 'none'; return; }
      historyWrap.style.display = '';
      historyList.innerHTML = hist.map(f => `<span class="history-chip">${f.emoji || '🍽️'} ${escapeHtml(f.name)}</span>`).join('');
    }

    function pushHistory(food) {
      let hist = [];
      try { hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (err) { hist = []; }
      hist.unshift({ name: food.name, emoji: food.emoji });
      hist = hist.slice(0, 8);
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(hist)); } catch (err) { /* bỏ qua nếu storage bị chặn */ }
      renderHistory();
    }

    function showResult(food) {
      document.querySelector('#rp-emoji').textContent = food.emoji || '🍽️';
      document.querySelector('#rp-name').textContent = food.name;
      document.querySelector('#rp-category').textContent = food.category || '';
      document.querySelector('#rp-rare-badge').innerHTML = food.rare ? '<span class="rp-rare">★ Món hiếm</span>' : '';
      resultPanel.classList.add('show');
    }

    function spin() {
      if (spinning || !foods.length) return;
      spinning = true;
      spinBtn.disabled = true;
      spinBtn.textContent = 'Đang quay…';
      resultPanel.classList.remove('show');

      const winner = randomFood();
      const reelData = [];
      for (let i = 0; i < REEL_SLOTS; i++) {
        reelData.push(i === WINNER_INDEX ? winner : randomFood());
      }
      reelTrack.innerHTML = reelData.map(cardHtml).join('');
      reelTrack.style.transition = 'none';
      reelTrack.style.transform = 'translateX(0px)';
      void reelTrack.offsetWidth; // ép reflow để bỏ transition trước khi quay lại từ đầu

      const viewportWidth = reelViewport.clientWidth;
      const targetX = WINNER_INDEX * CARD_WIDTH + CARD_WIDTH / 2 - viewportWidth / 2;

      requestAnimationFrame(() => {
        reelTrack.style.transition = 'transform 5.2s cubic-bezier(.11,.83,.13,1)';
        reelTrack.style.transform = `translateX(-${targetX}px)`;
      });

      setTimeout(() => {
        spinning = false;
        spinBtn.disabled = false;
        spinBtn.textContent = '🎰 Quay tiếp';
        showResult(winner);
        pushHistory(winner);
      }, 5400);
    }

    spinBtn.addEventListener('click', spin);

    fetch(DATA_URL)
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(data => {
        if (!Array.isArray(data) || !data.length) throw new Error('dữ liệu rỗng');
        foods = data;
        spinBtn.disabled = false;
        spinBtn.textContent = '🎰 Quay ngay';
        // Bày sẵn vài thẻ tĩnh trong reel trước khi quay lần đầu, cho đỡ trống.
        const preview = [];
        for (let i = 0; i < 8; i++) preview.push(randomFood());
        reelTrack.innerHTML = preview.map(cardHtml).join('');
        renderHistory();
      })
      .catch(err => {
        console.warn('load food-gacha-data.json error:', err);
        loadError.textContent = '⚠️ Không tải được dữ liệu món ăn (food-gacha-data.json). Nếu đang mở trực tiếp file trên máy (file://), hãy mở trang qua địa chỉ web đã host (vd GitHub Pages) thay vì mở file trực tiếp, hoặc chạy 1 local server tĩnh rồi mở qua http://.';
        loadError.style.display = '';
        spinBtn.textContent = 'Không có dữ liệu';
      });
  </script>
</body>
</html>
