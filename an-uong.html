<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhật ký ăn uống</title>
  <style>
    :root {
      --ink: #202b2d;
      --muted: #6d7c7c;
      --paper: #f7f5ef;
      --card: #fffdf8;
      --line: #d8dfd8;
      --accent: #d96545;
      --accent-dark: #9d3f2d;
      --teal: #287b78;
      --good: #2f8f5b;
      --warn: #c98a1f;
      --bad: #c0392b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    .loading-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f8f5ed 0%, #eef4ee 100%);
      opacity: 1; transition: opacity .25s ease;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent-dark);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: linear-gradient(135deg, #f8f5ed 0%, #eef4ee 100%);
      font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    }
    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      gap: 10px;
    }

    /* Topbar kiểu Google Calendar: brand + điều hướng tháng */
    .topbar { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: clamp(19px, 4.5vw, 24px); font-weight: 800; color: #173f40; letter-spacing: -.01em; }
    .brand-icon { font-size: 1.15em; }
    .topbar-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .today-btn {
      height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--accent-dark); font: 700 12px Arial, sans-serif;
      letter-spacing: .02em; cursor: pointer;
    }
    .today-btn:hover { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
    .nav-btns { display: flex; gap: 4px; }
    .nav-btns button {
      width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--accent-dark); font: 700 16px Arial, sans-serif; cursor: pointer;
    }
    .nav-btns button:hover { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
    .month-label {
      flex: 1 1 100%; order: 3; text-align: center;
      font-weight: 700; color: #173f40; font-size: 15px; text-transform: capitalize;
    }
    @media (min-width: 640px) {
      .month-label { flex: 0 1 auto; order: 0; text-align: left; margin-left: 6px; font-size: 17px; }
    }

    /* Lịch dạng lưới tháng */
    .calendar-wrap {
      flex: 1 1 auto; min-height: 0; overflow: auto;
      border: 1px solid var(--line); border-radius: 14px; background: #fff;
      box-shadow: 0 1px 3px rgba(23, 39, 37, .06);
    }
    .calendar { display: flex; flex-direction: column; min-width: 640px; height: 100%; }
    .weekdays {
      flex: 0 0 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      border-bottom: 1px solid var(--line); background: rgba(40, 123, 120, .06);
    }
    .weekdays > div {
      padding: 8px 0; text-align: center; font: 700 11px Arial, sans-serif;
      letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    }
    .calendar-body { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
    .week-row { flex: 1 1 0; min-height: 84px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
    .week-row:last-child { border-bottom: none; }
    .day-cell {
      min-width: 0; border-right: 1px solid var(--line); padding: 6px 6px 5px;
      display: flex; flex-direction: column; gap: 4px; cursor: pointer; position: relative;
      transition: background .12s ease;
    }
    .day-cell:last-child { border-right: none; }
    .day-cell:hover { background: rgba(40, 123, 120, .06); }
    .day-cell.other-month { background: #faf9f3; }
    .day-cell.other-month .day-num { color: #b9c2b9; }
    .day-cell.past:not(.other-month) { background: #f7f5ee; }
    .day-num {
      width: 24px; height: 24px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 700; font-size: 13px; color: #173f40;
    }
    .day-cell.is-today .day-num { background: var(--accent-dark); color: #fff; }
    .day-status { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; }
    .day-status.good { background: var(--good); }
    .day-status.warn { background: var(--warn); }
    .day-status.bad { background: var(--bad); }
    .day-events { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
    .day-event {
      flex: 0 0 auto; display: flex; align-items: center; gap: 5px; padding: 2px 6px;
      border-radius: 5px; font-size: 11px; line-height: 15px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .day-event .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; }
    .day-event span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .day-more { flex: 0 0 auto; padding: 0 6px; color: var(--muted); font-size: 10.5px; font-weight: 700; }
    .day-empty-hint { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; opacity: 0; transition: opacity .12s ease; }
    .day-cell:hover .day-empty-hint { opacity: .45; }

    @media (max-width: 640px) {
      .calendar { min-width: 560px; }
      .week-row { min-height: 72px; }
      .day-event { font-size: 10px; padding: 2px 4px; }
    }

    .cal-legend { flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; color: var(--muted); font-size: 11px; }
    .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .cal-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

    /* Modal nhập nhanh */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(23, 39, 37, .45); align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
      background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      position: relative; box-shadow: 0 -10px 40px rgba(23, 39, 37, .3);
    }
    @media (min-width: 560px) {
      .modal-overlay { align-items: center; }
      .modal { border-radius: 18px; max-height: 82vh; }
    }
    .modal-close {
      position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%;
      border: none; background: #f1efe7; color: var(--muted); font-size: 16px; cursor: pointer;
    }
    .modal h3 { margin: 0 22px 12px 0; color: #173f40; font-size: 17px; text-transform: capitalize; }

    .modal-entries { margin-bottom: 6px; }
    .meal-entry { position: relative; padding: 8px 30px 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .meal-entry:first-child { border-top: none; }
    .meal-entry .meal-tag { display: inline-block; margin-right: 7px; padding: 2px 7px; background: var(--cat, var(--accent-dark)); color: #fff; border-radius: 99px; font: 700 10px Arial, sans-serif; letter-spacing: .03em; text-transform: uppercase; }
    .meal-entry .meal-food { font-weight: 700; }
    .meal-entry .meal-meta { margin-top: 2px; color: var(--muted); font-size: 11.5px; }
    .meal-edit-btn {
      position: absolute; top: 8px; right: 0; width: 24px; height: 24px; border: none;
      background: #f1efe7; border-radius: 50%; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .meal-edit-btn:hover { background: var(--line); }
    .meal-entry-photo {
      display: block; margin-top: 6px; width: 64px; height: 64px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--line);
    }
    .empty-state { padding: 10px 0; color: var(--muted); font-size: 13px; }

    .quick-add { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
    .chip-label {
      margin: 0 0 6px; color: var(--muted); font: 700 11px Arial, sans-serif;
      letter-spacing: .04em; text-transform: uppercase; transition: color .15s ease;
    }
    .chip-label.missing { color: var(--bad); }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px; background: #fff;
      color: var(--ink); font-size: 12.5px; cursor: pointer; user-select: none;
    }
    .chip.active { background: var(--teal); border-color: var(--teal); color: #fff; }
    .chip-row[data-group="status"] .chip.active { background: var(--accent-dark); border-color: var(--accent-dark); }
    .chip-row[data-group="meal"] .chip { border-color: var(--cat); color: var(--cat); font-weight: 700; }
    .chip-row[data-group="meal"] .chip.active { background: var(--cat); border-color: var(--cat); color: #fff; }
    #modal-food {
      width: 100%; margin-bottom: 10px; padding: 10px 12px; color: var(--ink); background: #fff;
      border: 1px solid var(--line); border-radius: 9px; font: 14px/1.4 "Segoe UI", Arial, sans-serif;
    }
    #modal-food:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(40, 123, 120, .14); }
    .photo-row { margin-bottom: 10px; }
    .photo-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px dashed var(--line);
      border-radius: 9px; background: #fff; color: var(--muted); font-size: 12.5px; cursor: pointer; user-select: none;
    }
    .photo-btn:hover { border-color: var(--teal); color: var(--teal); }
    .photo-preview { position: relative; display: inline-block; }
    .photo-preview img {
      width: 84px; height: 84px; object-fit: cover; border-radius: 9px; border: 1px solid var(--line); display: block;
    }
    .photo-preview button {
      position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%;
      border: none; background: var(--bad); color: #fff; font-size: 13px; line-height: 1; cursor: pointer;
    }
    #modal-save {
      width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--accent-dark); color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      font: 700 13px Arial, sans-serif; letter-spacing: .03em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #modal-save:hover { background: var(--accent-dark); }
    #modal-save:disabled { opacity: .85; cursor: default; }
    .btn-spinner {
      display: none; width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .4); border-top-color: #fff;
      animation: spin .6s linear infinite;
    }
    .edit-cancel-link {
      display: none; width: 100%; margin-top: 8px; padding: 6px; border: none; background: none;
      color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer;
    }
    .save-error { margin: 8px 0 0; color: var(--bad); font-size: 12px; font-weight: 700; }

    .modal-suggestion { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .ai-comment {
      display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; padding: 10px 12px;
      background: rgba(40, 123, 120, .08); border: 1px solid rgba(40, 123, 120, .2); border-radius: 10px;
      font-size: 13px; line-height: 1.5; color: #173f40;
    }
    .ai-comment-icon { flex: 0 0 auto; font-size: 16px; }
    .suggestion-item { display: flex; gap: 10px; padding: 8px 0; font-size: 13px; }
    .suggestion-icon { flex: 0 0 auto; font-size: 18px; line-height: 1; }
    .suggestion-body b { display: block; margin-bottom: 2px; color: #173f40; font-size: 13px; }
    .suggestion-body span { color: var(--muted); font-size: 12.5px; }
    .pill-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .pill { padding: 3px 8px; background: #edf4f0; color: #35645f; border-radius: 99px; font-size: 11px; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>
  <div class="page">
    <div class="topbar">
      <div class="brand"><span class="brand-icon">🍲</span><span>Nhật ký ăn uống</span></div>
      <span class="month-label" id="cal-month-label"></span>
      <div class="topbar-controls">
        <button type="button" class="today-btn" id="cal-today-btn">Hôm nay</button>
        <div class="nav-btns">
          <button type="button" id="cal-prev" aria-label="Tháng trước">‹</button>
          <button type="button" id="cal-next" aria-label="Tháng sau">›</button>
        </div>
      </div>
    </div>

    <div class="calendar-wrap">
      <div class="calendar">
        <div class="weekdays">
          <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
        </div>
        <div class="calendar-body" id="cal-grid"></div>
      </div>
    </div>

    <div class="cal-legend" id="cal-legend"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close" type="button">×</button>
      <h3 id="modal-date-label"></h3>

      <div class="modal-entries" id="modal-entries"></div>

      <p class="empty-state" id="past-note" style="display:none">🔒 Ngày đã qua, chỉ xem lại nhật ký thôi nhé.</p>

      <div class="quick-add" id="quick-add">
        <p class="chip-label" id="chip-meal-label">Bữa</p>
        <div class="chip-row" data-group="meal" id="chip-meal">
          <span class="chip" data-value="Sáng" style="--cat:#3E7CC2">🌅 Sáng</span>
          <span class="chip" data-value="Trưa" style="--cat:#D9A61E">☀️ Trưa</span>
          <span class="chip" data-value="Xế" style="--cat:#D9772E">🍪 Xế</span>
          <span class="chip" data-value="Tối" style="--cat:#7C5FB5">🌙 Tối</span>
          <span class="chip" data-value="Khuya" style="--cat:#2E4A63">🌌 Khuya</span>
          <span class="chip" data-value="Ăn vặt" style="--cat:#C24E80">🍬 Ăn vặt</span>
        </div>
        <p class="chip-label" id="chip-status-label">Tình trạng</p>
        <div class="chip-row" data-group="status" id="chip-status">
          <span class="chip" data-value="on">🙂 Ổn</span>
          <span class="chip" data-value="it">😐 Ăn ít</span>
          <span class="chip" data-value="dở">😣 Không ngon</span>
          <span class="chip" data-value="bo">❌ Bỏ bữa</span>
        </div>
        <div class="chip-row" id="chip-veggie">
          <span class="chip" data-value="veggie">🥗 Có rau</span>
        </div>
        <input type="text" id="modal-food" placeholder="Món ăn (không bắt buộc)">

        <div class="photo-row" id="photo-row">
          <label class="photo-btn" for="modal-photo-input" id="photo-add-label">📷 Thêm ảnh món ăn</label>
          <input type="file" accept="image/*" id="modal-photo-input" style="display:none">
          <div class="photo-preview" id="photo-preview" style="display:none">
            <img id="photo-preview-img" alt="Ảnh món ăn">
            <button type="button" id="photo-remove-btn" title="Bỏ ảnh">×</button>
          </div>
        </div>

        <button type="button" id="modal-save"><span id="modal-save-label">Lưu bữa này</span><span class="btn-spinner" id="modal-save-spinner"></span></button>
        <button type="button" id="cancel-edit-btn" class="edit-cancel-link">Huỷ chỉnh sửa</button>
        <p class="save-error" id="save-error" style="display:none"></p>
      </div>

      <div class="modal-suggestion" id="modal-suggestion"></div>
    </div>
  </div>

  <script>
    // Dùng chung Apps Script với trang chính (index.html).
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyM2ODmrwD-mlM4CalUG4pSzGVwsBq9uw2GT6qJBWIDO7EIXPpxyZJNlP22m90m-lXM/exec';

    function gasGet(kind) {
      if (!GAS_ENDPOINT) return Promise.resolve([]);
      return fetch(`${GAS_ENDPOINT}?kind=${kind}&t=${Date.now()}`).then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      });
    }

    function gasPost(payload) {
      if (!GAS_ENDPOINT) return Promise.resolve({ ok: true });
      return fetch(GAS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      }).then(res => res.json()).catch(err => {
        console.warn('gas post error:', err);
        return { ok: false, error: String(err) };
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function todayStr() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function pickRandom(pool, count) {
      const copy = [...pool];
      const out = [];
      while (copy.length && out.length < count) {
        out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
      }
      return out;
    }

    const SNACK_POOL = [
      'Sữa chua + granola', 'Chuối chín', 'Sữa hạt óc chó/hạnh nhân', 'Bánh mì bơ đậu phộng',
      'Súp gà nhẹ', 'Cháo yến mạch', 'Chè đậu xanh ít ngọt', 'Trái cây theo mùa',
      'Sinh tố bơ chuối', 'Khoai lang hấp', 'Ngũ cốc + sữa tươi', 'Bánh flan',
    ];
    const VEGGIE_POOL = [
      'Canh rau ngót', 'Rau luộc chấm kho quẹt', 'Salad trộn dầu giấm', 'Nộm đu đủ/su hào',
      'Rau xào tỏi', 'Sinh tố rau củ', 'Canh bí đỏ', 'Rau cải luộc',
    ];

    // Gộp "mức ăn" + "vị" thành 1 lựa chọn duy nhất cho gọn khi nhập trên điện thoại.
    const STATUS_MAP = {
      on: { portion: 'Ăn hết', taste: 'Ngon' },
      it: { portion: 'Ăn ít', taste: 'Tạm' },
      'dở': { portion: 'Ăn ít', taste: 'Không ngon' },
      bo: { portion: 'Bỏ bữa', taste: '' },
    };
    const STATUS_LABEL = { on: 'Ổn', it: 'Ăn ít', 'dở': 'Không ngon', bo: 'Bỏ bữa' };
    const MEAL_SLOTS = ['Sáng', 'Trưa', 'Xế', 'Tối', 'Khuya', 'Ăn vặt'];
    const CATEGORY_COLORS = {
      'Sáng': '#3E7CC2',
      'Trưa': '#D9A61E',
      'Xế': '#D9772E',
      'Tối': '#7C5FB5',
      'Khuya': '#2E4A63',
      'Ăn vặt': '#C24E80',
    };
    const CATEGORY_ICONS = {
      'Sáng': '🌅',
      'Trưa': '☀️',
      'Xế': '🍪',
      'Tối': '🌙',
      'Khuya': '🌌',
      'Ăn vặt': '🍬',
    };

    (function initMealTracker() {
      const calGrid = document.querySelector('#cal-grid');
      const calMonthLabel = document.querySelector('#cal-month-label');
      const overlay = document.querySelector('#modal-overlay');
      const modalDateLabel = document.querySelector('#modal-date-label');
      const modalEntries = document.querySelector('#modal-entries');
      const modalSuggestion = document.querySelector('#modal-suggestion');
      const modalFood = document.querySelector('#modal-food');
      const quickAdd = document.querySelector('#quick-add');
      const pastNote = document.querySelector('#past-note');
      const photoInput = document.querySelector('#modal-photo-input');
      const photoPreview = document.querySelector('#photo-preview');
      const photoPreviewImg = document.querySelector('#photo-preview-img');
      const photoAddLabel = document.querySelector('#photo-add-label');
      if (!calGrid) return;

      let entries = [];
      const now = new Date();
      let shownYear = now.getFullYear();
      let shownMonth = now.getMonth(); // 0-based
      let selectedDate = null;
      let selectedMeal = null;
      let selectedStatus = null;
      let veggieOn = false;
      let editingEntryId = null;
      let pendingPhotoDataUrl = null;
      let existingPhotoId = null;

      function entriesForDate(dateStr) {
        return entries.filter(e => e.date === dateStr);
      }

      function dayStatus(dayEntries) {
        if (!dayEntries.length) return 'none';
        const skipped = dayEntries.filter(e => e.portion === 'Bỏ bữa').length;
        const rough = dayEntries.filter(e => e.portion === 'Ăn ít' || e.taste === 'Không ngon').length;
        const hasVeggie = dayEntries.some(e => e.veggie);
        if (skipped > 0 || rough >= 2) return 'bad';
        if (rough >= 1 || !hasVeggie) return 'warn';
        return 'good';
      }

      function dateKey(y, m, d) {
        const pad = n => String(n).padStart(2, '0');
        return `${y}-${pad(m + 1)}-${pad(d)}`;
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function monthGridStart(y, m) {
        const first = new Date(y, m, 1);
        const offset = (first.getDay() + 6) % 7; // Thứ 2 = 0
        const start = new Date(y, m, 1);
        start.setDate(1 - offset);
        return start;
      }

      function renderCalendar() {
        const label = new Intl.DateTimeFormat('vi-VN', { month: 'long', year: 'numeric' }).format(new Date(shownYear, shownMonth, 1));
        calMonthLabel.textContent = capitalize(label);

        const start = monthGridStart(shownYear, shownMonth);
        let rows = '';
        for (let w = 0; w < 6; w++) {
          let cells = '';
          for (let c = 0; c < 7; c++) {
            const d = new Date(start);
            d.setDate(start.getDate() + w * 7 + c);
            const key = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
            const dayEntries = entriesForDate(key).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            const status = dayStatus(dayEntries);

            const classes = ['day-cell'];
            if (d.getMonth() !== shownMonth) classes.push('other-month');
            if (key === todayStr()) classes.push('is-today');
            if (key < todayStr()) classes.push('past');

            const MAX_VISIBLE = 3;
            const visible = dayEntries.slice(0, MAX_VISIBLE);
            const extra = dayEntries.length - visible.length;
            const eventsHtml = visible.map(e => {
              const hex = CATEGORY_COLORS[e.meal] || '#888888';
              const bad = e.portion === 'Bỏ bữa' || e.portion === 'Ăn ít' || e.taste === 'Không ngon';
              const text = `${CATEGORY_ICONS[e.meal] || ''} ${escapeHtml(e.meal || '')}${e.food ? ' · ' + escapeHtml(e.food) : ''}${bad ? ' ⚠️' : ''}`;
              return `<div class="day-event" style="background:${hex}22;color:${hex}"><span class="dot" style="background:${hex}"></span><span>${text}</span></div>`;
            }).join('') + (extra > 0 ? `<div class="day-more">+${extra} khác</div>` : '');

            cells += `
              <div class="${classes.join(' ')}" data-date="${key}">
                <span class="day-num">${d.getDate()}</span>
                ${status !== 'none' ? `<span class="day-status ${status}"></span>` : ''}
                <div class="day-events">${eventsHtml || '<span class="day-empty-hint">+</span>'}</div>
              </div>`;
          }
          rows += `<div class="week-row">${cells}</div>`;
        }
        calGrid.innerHTML = rows;
        calGrid.querySelectorAll('[data-date]').forEach(el => {
          el.addEventListener('click', () => openModal(el.dataset.date));
        });
      }

      function renderLegend() {
        const legend = document.querySelector('#cal-legend');
        legend.innerHTML = MEAL_SLOTS.map(slot =>
          `<span><i style="background:${CATEGORY_COLORS[slot]}"></i>${CATEGORY_ICONS[slot]} ${escapeHtml(slot)}</span>`
        ).join('');
      }

      function statusKeyFromEntry(e) {
        for (const key in STATUS_MAP) {
          const m = STATUS_MAP[key];
          if (m.portion === (e.portion || '') && m.taste === (e.taste || '')) return key;
        }
        return null;
      }

      function renderModalEntries() {
        const dayEntries = entriesForDate(selectedDate).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        if (!dayEntries.length) {
          modalEntries.innerHTML = '<p class="empty-state">Chưa có nhật ký ngày này.</p>';
          return;
        }
        const canEdit = selectedDate === todayStr();
        modalEntries.innerHTML = dayEntries.map(e => `
          <div class="meal-entry">
            ${canEdit ? `<button type="button" class="meal-edit-btn" data-time="${escapeHtml(e.time || '')}" title="Sửa bữa này">✏️</button>` : ''}
            <span class="meal-tag" style="--cat:${CATEGORY_COLORS[e.meal] || ''}">${CATEGORY_ICONS[e.meal] || ''} ${escapeHtml(e.meal || '')}</span>
            <span class="meal-food">${escapeHtml(e.food || '(không ghi món)')}</span>
            <div class="meal-meta">${escapeHtml(e.portion || '')}${e.taste ? ` · ${escapeHtml(e.taste)}` : ''} · ${e.veggie ? 'có rau' : 'không rau'}</div>
            ${e.photo ? `<a href="https://drive.google.com/file/d/${encodeURIComponent(e.photo)}/view" target="_blank" rel="noopener"><img class="meal-entry-photo" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(e.photo)}&sz=w200" alt="Ảnh món ăn" loading="lazy"></a>` : ''}
          </div>`).join('');
        if (canEdit) {
          modalEntries.querySelectorAll('.meal-edit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const entry = dayEntries.find(e => e.time === btn.dataset.time);
              if (entry) enterEditMode(entry);
            });
          });
        }
      }

      const CORE_MEALS = ['Sáng', 'Trưa', 'Tối'];

      function buildAiComment(dayEntries, dateStr) {
        const isToday = dateStr === todayStr();
        const loggedMeals = new Set(dayEntries.map(e => e.meal));
        const missingCore = CORE_MEALS.filter(m => !loggedMeals.has(m));
        const skipped = dayEntries.filter(e => e.portion === 'Bỏ bữa');
        const rough = dayEntries.filter(e => e.portion === 'Ăn ít' || e.taste === 'Không ngon');
        const hasVeggie = dayEntries.some(e => e.veggie);
        const parts = [];

        if (!dayEntries.length) {
          parts.push(isToday ? 'Hôm nay chưa ghi bữa nào cả.' : 'Ngày này chưa có nhật ký nào.');
          return parts.join(' ');
        }

        parts.push(`Đã ghi ${dayEntries.length} bữa trong ngày.`);
        if (missingCore.length) {
          parts.push(`Còn thiếu bữa ${missingCore.join(', ')}${isToday ? ' (nếu chưa tới giờ thì bỏ qua)' : ''}.`);
        }
        if (skipped.length) parts.push(`Đã bỏ bữa ${skipped.map(e => e.meal).join(', ')}.`);
        if (rough.length) parts.push(`Có ${rough.length} bữa ăn ít hoặc không ngon miệng.`);
        if (!hasVeggie) parts.push('Chưa thấy rau trong ngày.');
        if (!missingCore.length && !skipped.length && !rough.length && hasVeggie) {
          parts.push('Ăn uống ổn định, tiếp tục duy trì vậy nhé!');
        }
        return parts.join(' ');
      }

      function renderModalSuggestion() {
        const dayEntries = entriesForDate(selectedDate);
        const isFuture = selectedDate > todayStr();
        const comment = isFuture ? '' : buildAiComment(dayEntries, selectedDate);

        const items = [];
        if (dayEntries.length) {
          const skipped = dayEntries.filter(e => e.portion === 'Bỏ bữa');
          const rough = dayEntries.filter(e => e.portion === 'Ăn ít' || e.taste === 'Không ngon');
          const hasVeggie = dayEntries.some(e => e.veggie);
          if (skipped.length || rough.length) {
            items.push({ icon: '🍪', body: 'Gợi ý ăn bù / bữa phụ nhẹ:', pills: pickRandom(SNACK_POOL, 3) });
          }
          if (!hasVeggie) {
            items.push({ icon: '🥗', body: 'Gợi ý bổ sung rau:', pills: pickRandom(VEGGIE_POOL, 3) });
          }
        }

        const commentHtml = comment ? `
          <div class="ai-comment">
            <span class="ai-comment-icon">🤖</span>
            <span>${escapeHtml(comment)}</span>
          </div>` : '';

        modalSuggestion.innerHTML = commentHtml + items.map(item => `
          <div class="suggestion-item">
            <div class="suggestion-icon">${item.icon}</div>
            <div class="suggestion-body">
              <span>${escapeHtml(item.body)}</span>
              <div class="pill-list">${item.pills.map(p => `<span class="pill">${escapeHtml(p)}</span>`).join('')}</div>
            </div>
          </div>`).join('');
      }

      function showPhotoPreview(src) {
        photoPreviewImg.src = src;
        photoPreview.style.display = 'inline-block';
        photoAddLabel.style.display = 'none';
      }

      function clearPhotoState() {
        pendingPhotoDataUrl = null;
        existingPhotoId = null;
        photoInput.value = '';
        photoPreviewImg.src = '';
        photoPreview.style.display = 'none';
        photoAddLabel.style.display = 'inline-flex';
      }

      // Thu nhỏ ảnh (tối đa 1024px cạnh dài, nén JPEG) trước khi upload,
      // vì ảnh chụp trực tiếp từ điện thoại thường vài MB, gửi thẳng sẽ rất chậm.
      function resizeImageToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(reader.error);
          reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
              const maxSide = 1024;
              const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(img.width * scale);
              canvas.height = Math.round(img.height * scale);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL('image/jpeg', 0.72));
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      photoInput.addEventListener('change', async () => {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;
        try {
          pendingPhotoDataUrl = await resizeImageToDataUrl(file);
          existingPhotoId = null;
          showPhotoPreview(pendingPhotoDataUrl);
        } catch (err) {
          console.warn('resize photo error:', err);
        }
      });

      document.querySelector('#photo-remove-btn').addEventListener('click', clearPhotoState);

      function resetChips() {
        selectedMeal = null;
        selectedStatus = null;
        veggieOn = false;
        editingEntryId = null;
        modalFood.value = '';
        clearPhotoState();
        overlay.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        overlay.querySelectorAll('.chip-label').forEach(l => l.classList.remove('missing'));
        document.querySelector('#save-error').style.display = 'none';
        saveLabel.textContent = 'Lưu bữa này';
        cancelEditBtn.style.display = 'none';
      }

      function enterEditMode(entry) {
        editingEntryId = entry.time;
        selectedMeal = entry.meal;
        selectedStatus = statusKeyFromEntry(entry);
        veggieOn = !!entry.veggie;
        modalFood.value = entry.food || '';
        pendingPhotoDataUrl = null;
        existingPhotoId = entry.photo || null;
        if (existingPhotoId) {
          showPhotoPreview(`https://drive.google.com/thumbnail?id=${encodeURIComponent(existingPhotoId)}&sz=w200`);
        } else {
          clearPhotoState();
        }

        overlay.querySelector('#chip-meal').querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.value === selectedMeal));
        overlay.querySelector('#chip-status').querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.value === selectedStatus));
        overlay.querySelector('#chip-veggie').querySelectorAll('.chip').forEach(c => c.classList.toggle('active', veggieOn));
        chipMealLabel.classList.remove('missing');
        chipStatusLabel.classList.remove('missing');
        document.querySelector('#save-error').style.display = 'none';

        saveLabel.textContent = 'Cập nhật bữa này';
        cancelEditBtn.style.display = 'block';
        quickAdd.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function openModal(dateStr) {
        selectedDate = dateStr;
        resetChips();
        const label = new Date(dateStr + 'T00:00:00').toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
        modalDateLabel.textContent = label.charAt(0).toUpperCase() + label.slice(1);
        renderModalEntries();
        renderModalSuggestion();

        const today = todayStr();
        const isToday = dateStr === today;
        quickAdd.style.display = isToday ? '' : 'none';
        pastNote.style.display = isToday ? 'none' : '';
        pastNote.textContent = dateStr < today
          ? '🔒 Ngày đã qua, chỉ xem lại nhật ký thôi nhé.'
          : '🔒 Chưa tới ngày này, quay lại đúng ngày để ghi nhật ký nhé.';

        overlay.classList.add('open');
      }

      function closeModal() {
        overlay.classList.remove('open');
      }

      overlay.querySelector('#modal-close').addEventListener('click', closeModal);
      overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

      const chipMealLabel = document.querySelector('#chip-meal-label');
      const chipStatusLabel = document.querySelector('#chip-status-label');

      overlay.querySelector('#chip-meal').addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        overlay.querySelector('#chip-meal').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedMeal = chip.dataset.value;
        chipMealLabel.classList.remove('missing');
      });
      overlay.querySelector('#chip-status').addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        overlay.querySelector('#chip-status').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedStatus = chip.dataset.value;
        chipStatusLabel.classList.remove('missing');
      });
      overlay.querySelector('#chip-veggie').addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        veggieOn = !veggieOn;
        chip.classList.toggle('active', veggieOn);
      });

      const saveError = document.querySelector('#save-error');
      const saveBtn = overlay.querySelector('#modal-save');
      const saveLabel = document.querySelector('#modal-save-label');
      const saveSpinner = document.querySelector('#modal-save-spinner');
      const cancelEditBtn = document.querySelector('#cancel-edit-btn');

      function setSaving(isSaving) {
        saveBtn.disabled = isSaving;
        saveSpinner.style.display = isSaving ? 'inline-block' : 'none';
      }

      cancelEditBtn.addEventListener('click', () => {
        resetChips();
      });

      saveBtn.addEventListener('click', async () => {
        chipMealLabel.classList.toggle('missing', !selectedMeal);
        chipStatusLabel.classList.toggle('missing', !selectedStatus);
        if (!selectedMeal || !selectedStatus) return;
        const mapped = STATUS_MAP[selectedStatus];
        const isEditing = !!editingEntryId;
        const entry = {
          time: isEditing ? editingEntryId : new Date().toISOString(),
          date: selectedDate,
          meal: selectedMeal,
          food: modalFood.value.trim(),
          portion: mapped.portion,
          taste: mapped.taste,
          veggie: veggieOn,
          note: '',
        };
        const photoPayload = pendingPhotoDataUrl
          ? { photo: pendingPhotoDataUrl }
          : (existingPhotoId ? { photoId: existingPhotoId } : {});

        saveError.style.display = 'none';
        setSaving(true);
        const result = isEditing
          ? await gasPost({ kind: 'meal-update', id: editingEntryId, ...entry, ...photoPayload })
          : await gasPost({ kind: 'meal', ...entry, ...photoPayload });
        setSaving(false);

        if (!result || result.ok === false) {
          saveError.textContent = isEditing
            ? '⚠️ Không cập nhật được lên máy chủ — thử lại nhé.'
            : '⚠️ Không lưu được lên máy chủ (Apps Script chưa nhận "meal") — bữa này sẽ mất khi tải lại trang. Cần deploy lại Apps Script.';
          saveError.style.display = '';
          return;
        }

        entry.photo = result.photoId || '';
        if (isEditing) {
          const idx = entries.findIndex(e => e.time === editingEntryId);
          if (idx !== -1) entries[idx] = entry; else entries.push(entry);
        } else {
          entries.push(entry);
        }
        renderCalendar();
        renderModalEntries();
        renderModalSuggestion();
        resetChips();
      });

      document.querySelector('#cal-prev').addEventListener('click', () => {
        shownMonth--;
        if (shownMonth < 0) { shownMonth = 11; shownYear--; }
        renderCalendar();
      });
      document.querySelector('#cal-next').addEventListener('click', () => {
        shownMonth++;
        if (shownMonth > 11) { shownMonth = 0; shownYear++; }
        renderCalendar();
      });
      document.querySelector('#cal-today-btn').addEventListener('click', () => {
        const d = new Date();
        shownYear = d.getFullYear();
        shownMonth = d.getMonth();
        renderCalendar();
      });

      function hideLoadingOverlay() {
        const loadingOverlay = document.querySelector('#loading-overlay');
        if (!loadingOverlay) return;
        loadingOverlay.classList.add('hidden');
        loadingOverlay.addEventListener('transitionend', () => loadingOverlay.remove(), { once: true });
      }

      async function loadEntries() {
        try {
          let fresh;
          try {
            fresh = await gasGet('meal');
          } catch (err) {
            console.warn('meal load error:', err);
            return;
          }
          if (!Array.isArray(fresh)) {
            console.warn('meal load error: phản hồi không phải mảng (Apps Script có thể chưa cập nhật kind=meal)', fresh);
            return;
          }
          entries = fresh;
          renderCalendar();
          if (overlay.classList.contains('open')) {
            renderModalEntries();
            renderModalSuggestion();
          }
        } finally {
          hideLoadingOverlay();
        }
      }

      renderLegend();
      renderCalendar();
      loadEntries();
      setInterval(loadEntries, 15000);
    })();
  </script>
</body>
</html>
